[package]
name = "tobiifreed"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Tobii Eye Tracker 5 daemon. Userspace libusb, Unix socket, optional WebSocket."
publish = false

[[bin]]
name = "tobiifreed"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
hmac = "0.12"
libc = "0.2"
md-5 = "0.10"
rusb = "0.9"
serde_json = "1"
sha1 = "0.10"
